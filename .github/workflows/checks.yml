name: Checks CI

on:
  push:
    branches: [master]
    paths:
      - '**.go'
      - '**.mod'
      - 'mcl/**'
      - 'tests/**'
      - 'examples/**'

  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - 'mcl/**'
      - 'tests/**'
      - 'examples/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
